<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhyLang Studio Community 0.6.0</title><style>
:root{color-scheme:dark;--bg:#080e1b;--panel:#111a2c;--line:#263754;--text:#e8efff;--muted:#91a3c5;--good:#62d995;--bad:#ff7681}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}header{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0c1528;border-bottom:1px solid var(--line)}header b{font-size:20px}.badge{padding:3px 8px;border-radius:999px;background:#143565;color:#bcd5ff;font-size:12px}button,input,select,textarea{font:inherit}button,input,select{background:#15233c;color:var(--text);border:1px solid #365179;border-radius:7px;padding:7px 10px}button{cursor:pointer}button.primary{background:#2865c7;border-color:#5b96f7}.app{display:grid;grid-template-columns:minmax(520px,1.3fr) minmax(390px,.85fr);height:calc(100vh - 56px)}.left{min-width:0;display:grid;grid-template-rows:1fr 230px;border-right:1px solid var(--line)}.editor-wrap{position:relative;padding:10px;background:#090f1d;min-height:0}.editor{width:100%;height:100%;resize:none;background:#0d1628;color:#e7f0ff;border:1px solid var(--line);border-radius:9px;padding:14px;outline:none;tab-size:4;font:14px/1.55 Consolas,"Cascadia Code",monospace;white-space:pre;overflow:auto}.autocomplete{position:absolute;z-index:10;display:none;min-width:240px;max-width:420px;max-height:260px;overflow:auto;background:#111c31;border:1px solid #41618f;border-radius:8px;box-shadow:0 12px 40px #0008}.autocomplete div{padding:6px 10px;font:13px Consolas,monospace;cursor:pointer}.autocomplete div.selected,.autocomplete div:hover{background:#22487d}.console{padding:10px;background:#070c16;border-top:1px solid var(--line);overflow:auto}.console-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.5 Consolas,monospace}.right{overflow:auto;padding:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}.card h3{margin:0 0 9px;font-size:16px}.row{display:flex;gap:7px;margin:7px 0}.row>*{min-width:0;flex:1}.result{background:#080f1d;border-radius:7px;padding:9px;min-height:38px;max-height:220px;overflow:auto}.small{font-size:12px;color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.spacer{flex:1}@media(max-width:980px){body{overflow:auto}.app{display:block;height:auto}.left{height:760px;border-right:0}.right{border-top:1px solid var(--line)}}
</style></head><body><header><b>PhyLang Studio</b><span class="badge">前后端一体化 0.6.0</span><span class="small">自主 PIR / VM / 证明 / 约束后端</span><span class="spacer"></span><button onclick="loadExample()">综合示例</button><button onclick="checkCode()">检查</button><button class="primary" onclick="runCode()">运行 ▶</button></header><main class="app"><section class="left"><div class="editor-wrap"><textarea id="code" class="editor" spellcheck="false" autocomplete="off"></textarea><div id="ac" class="autocomplete"></div></div><div class="console"><div class="console-head"><b>终端输出</b><span id="status"></span><span class="spacer"></span><span class="small">Ctrl+Space 补全 · ↑↓ 选择 · Tab/Enter 插入</span><button onclick="$('out').textContent=''">清空</button></div><pre id="out"></pre></div></section><aside class="right">
<div class="card"><h3>自主后端表达式执行</h3><div class="row"><input id="expr" value="m*v^2/2"><input id="assign" value="m=2,v=3"></div><div class="row"><input id="vardim" value="m:Mass,v:Velocity"><button onclick="backendRun()">VM 执行</button><button onclick="compileSSA()">生成 PIR-SSA</button></div><pre id="backendout" class="result"></pre></div>
<div class="card"><h3>量纲与约束求解</h3><div class="row"><input id="dimexpr" value="m*a"><input id="dimvars" value="m:Mass,a:Acceleration"><input id="expect" value="Force"></div><div class="row"><button onclick="dimensionCheck()">量纲检查</button><input id="formula" value="x>=0 && x<=1 && x>2"><button onclick="solveFormula()">SAT/QF_LRA</button></div><pre id="solverout" class="result"></pre></div>
<div class="card"><h3>精确代数证明</h3><div class="row"><input id="lhs" value="(x+1)^2"><input id="rhs" value="x^2+2*x+1"></div><div class="row"><input id="theorem" value="square_identity"><input id="proofvars" value="x:Dimensionless"><button onclick="prove()">生成 .phyproof</button></div><pre id="proofout" class="result"></pre></div>

<div class="card"><h3>社区扩展包与 GitHub 仓库</h3><div class="small">支持本地包、GitHub Pages 静态注册表、版本搜索、SHA-256 下载校验和递归依赖安装。</div><div class="row"><input id="registryname" value="github" title="本地显示名称"><input id="registryrepo" placeholder="OWNER/REPOSITORY 或完整 index.json URL"><button onclick="addRegistry()">添加仓库</button></div><div class="row"><button onclick="listRegistries()">仓库列表</button><button onclick="checkRegistries()">检查仓库</button><input id="pkgquery" placeholder="搜索社区仓库"><button onclick="searchPackages()">搜索</button></div><div class="row"><input id="pkgpath" placeholder="包目录或 .phypkg 路径"><button onclick="validatePackage()">验证</button><button onclick="installPackage()">安装</button><button onclick="listPackages()">已安装包</button></div><div class="row"><input id="pkgname" placeholder="包名，如 community.mechanics"><input id="pkgconstraint" value="*"><button onclick="fetchPackage()">下载并安装</button></div><pre id="pkgout" class="result"></pre></div>
<div class="card"><h3>连接状态</h3><div class="small">Studio、完整 .phy 前端与自主后端运行在同一进程和同一来源中，不需要另启服务，也不存在跨端口 CORS。</div><pre id="health" class="result"></pre></div>
</aside></main><script>
const $=id=>document.getElementById(id);let acItems=[],acIndex=0,acStart=0,acTimer=0;async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.json()}function output(id,r){$(id).textContent=(r.output||'')+(r.error?'\n错误：'+r.error:'');$(id).className='result '+(r.ok?'good':r.error?'bad':'')}
function loadExample(){$('code').value=`import physics.classical;
import community.units.astronomy as astro;
import community.mechanics.linear-drag as drag only { linear_drag_force, kg_per_s };

let m = measured(2 kg, 0.01 kg);
let v = measured(3 [m/s], 0.02 [m/s]);
print 0.5*m*v^2 in J;
print uncertainty(0.5*m*v^2) in J;
print diff("sin(x)*exp(x)+x^3", "x");

fn kinetic_energy(mass, speed) {
    return 0.5*mass*speed^2;
}
print kinetic_energy(2 kg, 4 [m/s]) in J;

law Candidate {
    parameters {
        force: Force;
        mass: Mass;
        acceleration: Acceleration;
    }
    assumptions { mass > 0 kg; }
    equation { force == mass*acceleration; }
}
verify Candidate against NewtonSecondLaw with {
    force = 6 N;
    mass = 2 kg;
    acceleration = 3 [m/s^2];
};

print backend_run("x*x+2*x+1", "x=3");
print backend_solve("x>=0 && x<=1 && x>2");
print 1 astro.AU in km;
print drag.linear_drag_force(0.5 drag.kg_per_s, 4 [m/s]) in N;
`;hideAC()}
async function runCode(){const r=await post('/api/frontend/run',{source:$('code').value});$('out').textContent=(r.output||'')+(r.error?'\n'+r.error:'');$('status').textContent=r.ok?'运行成功':'运行失败';$('status').className=r.ok?'good':'bad'}async function checkCode(){const r=await post('/api/frontend/check',{source:$('code').value});$('out').textContent=(r.output||'')+(r.error?'\n'+r.error:'');$('status').textContent=r.ok?'检查通过':'检查失败';$('status').className=r.ok?'good':'bad'}
function parseAssign(text){const o={};text.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const p=x.indexOf('=');o[x.slice(0,p).trim()]=+x.slice(p+1)});return o}function parseVars(text){const o={};text.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const p=x.indexOf(':');o[x.slice(0,p).trim()]=x.slice(p+1).trim()});return o}
async function backendRun(){output('backendout',await post('/backend/api',{operation:'run',expression:$('expr').value,assignments:parseAssign($('assign').value),variables:parseVars($('vardim').value)}))}async function compileSSA(){output('backendout',await post('/backend/api',{operation:'compile',expression:$('expr').value,variables:parseVars($('vardim').value),emit:'ssa'}))}async function dimensionCheck(){output('solverout',await post('/backend/api',{operation:'dimension',expression:$('dimexpr').value,variables:parseVars($('dimvars').value),expectedDimension:$('expect').value}))}async function solveFormula(){output('solverout',await post('/backend/api',{operation:'solve',formula:$('formula').value}))}async function prove(){output('proofout',await post('/backend/api',{operation:'prove',theorem:$('theorem').value,lhs:$('lhs').value,rhs:$('rhs').value,variables:parseVars($('proofvars').value)}))}

async function addRegistry(){let raw=$('registryrepo').value.trim(),body={name:$('registryname').value.trim()||'github'};if(/^https?:|^github:|^github-pages:/.test(raw))body.url=raw;else body.repository=raw;output('pkgout',await post('/api/packages/registry-add',body))}async function listRegistries(){output('pkgout',await post('/api/packages/registries',{}))}async function checkRegistries(){output('pkgout',await post('/api/packages/registry-check',{}))}async function validatePackage(){output('pkgout',await post('/api/packages/validate',{path:$('pkgpath').value}))}async function installPackage(){output('pkgout',await post('/api/packages/install',{path:$('pkgpath').value}))}async function listPackages(){output('pkgout',await post('/api/packages/list',{}))}async function searchPackages(){output('pkgout',await post('/api/packages/search',{query:$('pkgquery').value}))}async function fetchPackage(){output('pkgout',await post('/api/packages/fetch',{name:$('pkgname').value,constraint:$('pkgconstraint').value}))}
function wordAtCaret(){const e=$('code'),p=e.selectionStart,b=e.value;let s=p;while(s>0&&/[A-Za-z0-9_.]/.test(b[s-1]))s--;return{prefix:b.slice(s,p),start:s,end:p}}async function requestAC(force=false){const w=wordAtCaret();if(!force&&w.prefix.length<1){hideAC();return}const r=await post('/api/completions',{source:$('code').value,prefix:w.prefix});if(!r.ok||!r.items.length){hideAC();return}acItems=r.items;acIndex=0;acStart=w.start;renderAC()}function renderAC(){const box=$('ac'),e=$('code'),before=e.value.slice(0,e.selectionStart),lines=before.split('\n'),line=lines.length-1,col=lines[lines.length-1].length;box.style.left=Math.max(10,Math.min(e.clientWidth-280,20+col*8-e.scrollLeft))+'px';box.style.top=Math.max(10,Math.min(e.clientHeight-280,18+line*21-e.scrollTop))+'px';box.innerHTML=acItems.map((x,i)=>'<div class="'+(i===acIndex?'selected':'')+'" data-i="'+i+'">'+x+'</div>').join('');box.style.display='block';box.querySelectorAll('div').forEach(d=>{d.onmousedown=ev=>{ev.preventDefault();acIndex=+d.dataset.i;insertAC()}})}function hideAC(){$('ac').style.display='none';acItems=[]}function insertAC(){if(!acItems.length)return;const e=$('code'),end=e.selectionStart,item=acItems[acIndex];e.setRangeText(item,acStart,end,'end');hideAC();e.focus()}
$('code').addEventListener('input',()=>{clearTimeout(acTimer);acTimer=setTimeout(()=>requestAC(false),110)});$('code').addEventListener('keydown',e=>{if(e.ctrlKey&&e.code==='Space'){e.preventDefault();requestAC(true);return}if(acItems.length){if(e.key==='ArrowDown'){e.preventDefault();acIndex=(acIndex+1)%acItems.length;renderAC()}else if(e.key==='ArrowUp'){e.preventDefault();acIndex=(acIndex+acItems.length-1)%acItems.length;renderAC()}else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insertAC()}else if(e.key==='Escape'){e.preventDefault();hideAC()}}else if(e.key==='Tab'){e.preventDefault();const x=e.target;x.setRangeText('    ',x.selectionStart,x.selectionEnd,'end')}});document.addEventListener('click',e=>{if(e.target!==$('code')&&!$('ac').contains(e.target))hideAC()});
fetch('/health').then(r=>r.json()).then(x=>$('health').textContent=JSON.stringify(x,null,2));loadExample();
</script></body></html>
