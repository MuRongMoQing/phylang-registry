name: Deploy registry to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: runtime/portable-go/go.mod
      - name: Verify source commit already passed validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/validate.yml/runs?head_sha={sha}&event=push&per_page=20'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2026-03-10',
              'User-Agent': 'phylang-registry-validation-gate',
          }
          deadline = time.time() + 15 * 60
          while time.time() < deadline:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              runs = payload.get('workflow_runs') or []
              runs.sort(key=lambda run: run.get('created_at', ''), reverse=True)
              if runs:
                  run = runs[0]
                  status = run.get('status')
                  conclusion = run.get('conclusion')
                  print(f'Validation run {run.get("id")}: status={status} conclusion={conclusion}')
                  if status == 'completed':
                      if conclusion != 'success':
                          raise SystemExit(f'Validation did not succeed: {run.get("html_url")}')
                      break
              time.sleep(10)
          else:
              raise SystemExit(f'No completed successful validate.yml run found for {sha}')
          PY
      - name: Build static registry
        shell: bash
        run: bash ./scripts/github/build-registry.sh build/pages "${GITHUB_REPOSITORY}" "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
